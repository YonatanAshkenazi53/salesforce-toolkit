<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Log — Admin Toolkit for Salesforce</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="apex-log-viewer.css">
</head>
<body class="alv-body">
  <div class="alv-shell">

    <!-- Top bar -->
    <div class="alv-topbar">
      <div class="alv-brand">
        <span class="alv-logo adbg-i" data-i="doc" aria-hidden="true"></span>
        <span class="alv-title" id="alvTitle">Apex Log</span>
        <span class="alv-meta" id="alvMeta"></span>
      </div>
      <div class="alv-actions">
        <span class="alv-fontctl" title="Adjust log text size">
          <button class="adbg-log-font-btn" id="alvFontDown" title="Smaller text" aria-label="Smaller log text">A−</button>
          <button class="adbg-log-font-btn" id="alvFontReset" title="Reset text size" aria-label="Reset log text size">A</button>
          <button class="adbg-log-font-btn" id="alvFontUp" title="Larger text" aria-label="Larger log text">A+</button>
        </span>
        <button class="btn btn-primary btn-sm"   id="alvCopyReportBtn" data-adbg-icon="copy">Copy Report</button>
        <button class="btn btn-secondary btn-sm" id="alvDlReportBtn" data-adbg-icon="doc">Download Report</button>
        <button class="btn btn-secondary btn-sm" id="alvDlRawBtn" data-adbg-icon="download">Raw Log</button>
      </div>
    </div>

    <!-- Search + filter row -->
    <div class="alv-controls">
      <input type="number" id="alvLogGoto" class="adbg-log-goto" placeholder="Go to line #" min="1" aria-label="Go to line number">

      <div class="adbg-log-search-row alv-search-row">
        <input type="text" id="alvLogSearch" class="adbg-log-search"
          placeholder="Find in log (Ctrl+F)… Enter = next, Shift+Enter = prev"
          autocomplete="off" aria-label="Find in log">
        <label class="adbg-log-search-opt" title="Match case — e.g. searching 'Account' finds Account but NOT ACCOUNT_TRIGGER; off, 'soql' also finds SOQL_EXECUTE_BEGIN">
          <input type="checkbox" id="alvLogCase"> Aa
        </label>
        <label class="adbg-log-search-opt" title="Regex search — e.g. 'SOQL|DML' finds lines with either word; 'LIMIT.*100' finds LIMIT followed by 100 on the same line; off, text matches literally">
          <input type="checkbox" id="alvLogRegex"> .*
        </label>
        <label class="adbg-log-search-opt" title="Whole word — e.g. 'Case' finds the Case object but NOT CaseNumber or uppercase(); off, it matches inside words too">
          <input type="checkbox" id="alvLogWord"> W
        </label>
        <span class="adbg-log-search-count" id="alvLogSearchCount" title="Match navigation">—</span>
        <button class="adbg-log-search-btn" id="alvLogSearchPrev" title="Previous match (Shift+Enter)" aria-label="Previous match"><span class="adbg-i" data-i="arrow-up" aria-hidden="true"></span></button>
        <button class="adbg-log-search-btn" id="alvLogSearchNext" title="Next match (Enter)" aria-label="Next match"><span class="adbg-i" data-i="arrow-down" aria-hidden="true"></span></button>
      </div>

      <input type="text" id="alvLogFilter" class="adbg-log-filter" placeholder="Filter to matching lines only…" aria-label="Filter log to matching lines">
    </div>

    <!-- Log view — fills the rest of the viewport -->
    <div class="adbg-log-view alv-log-view" id="alvLogView">
      <div class="adbg-detail-none">Loading log…</div>
    </div>

  </div>

  <script src="trusted-types-policy.js"></script>
  <!-- The licence gate. Loads before every view so no page can start
       work before the user has accepted. -->
  <script src="sftk-terms.js"></script>
  <script src="apex-log-viewer.js"></script>
</body>
</html>
