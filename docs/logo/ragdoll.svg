<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Admin Toolkit for Salesforce — the mark: the owner's blue-point ragdoll, as an ICON (2026-11-13: "make him
       chubby … it has to look more icony"). Five flat shapes, no outline, no fur detail: a wide round face, two small
       ears, the grey blaze-and-muzzle, two round blue eyes, a nose. Reads at 16 px. -->
  <defs><clipPath id="tile"><rect width="128" height="128" rx="26"/></clipPath></defs>
  <rect width="128" height="128" rx="26" fill="#0B2545"/>
  <g clip-path="url(#tile)">
    <!-- ears: small, rounded, set wide -->
    <path d="M14 58c-3-16-1-30 4-40 2-4 6-4 9-1l26 22z" fill="#8F92A0"/>
    <path d="M114 58c3-16 1-30-4-40-2-4-6-4-9-1L75 39z" fill="#8F92A0"/>
    <path d="M24 46c-1-7 0-13 2-18l14 12z" fill="#C7B5C6"/>
    <path d="M104 46c1-7 0-13-2-18L88 40z" fill="#C7B5C6"/>
    <!-- the face: wide and round, cheeks past the ears, sitting low in the tile -->
    <path d="M64 30c34 0 58 20 58 46 0 30-24 48-58 48S6 106 6 76c0-26 24-46 58-46z" fill="#F6F2EC"/>
    <!-- the blue-point mask: one shape, a blaze from the forehead widening into the muzzle -->
    <path d="M64 30c-4 0-7 .5-10 1.500 4 10 6 22 6 37-7 3-12 10-12 18 0 10 7 17 16 17s16-7 16-17c0-8-5-15-12-18 0-15 2-27 6-37-3-1-6-1.500-10-1.500z" fill="#9B9EAC"/>
    <!-- eyes: round, ragdoll blue -->
    <circle cx="39" cy="71" r="12" fill="#7CC3F7"/>
    <circle cx="89" cy="71" r="12" fill="#7CC3F7"/>
    <circle cx="40" cy="71" r="5.500" fill="#0B2545"/>
    <circle cx="88" cy="71" r="5.500" fill="#0B2545"/>
    <circle cx="43" cy="67.500" r="2.400" fill="#FFFFFF"/>
    <circle cx="91" cy="67.500" r="2.400" fill="#FFFFFF"/>
    <!-- nose and smile -->
    <path d="M57 80c0-2 2-3 4-3h6c2 0 4 1 4 3 0 3-3.500 6-7 6s-7-3-7-6z" fill="#4A4D5C"/>
    <path d="M56 92c2.500 3.500 5.500 3.500 8 0 2.500 3.500 5.500 3.500 8 0" fill="none" stroke="#4A4D5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
