<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 104 104">

  <!-- ════ DARK OUTLINE LAYER ════ -->
  <g fill="#2e3447" stroke="#2e3447" stroke-linecap="round" stroke-linejoin="round">
    <!-- hind legs — drawn first so the body overlaps their base -->
    <path d="M 35 30 Q 31 22 37 17" stroke-width="11" fill="none"/>
    <path d="M 39 27 Q 38 19 44 15" stroke-width="11" fill="none"/>
    <!-- curled body (cat chasing its tail) -->
    <path d="M 66 32.5 A 26 26 0 1 1 34 32.5" stroke-width="22" fill="none"/>
    <!-- front paw nub -->
    <path d="M 63 36 Q 60 38 62 41" stroke-width="10" fill="none"/>
    <!-- head -->
    <circle cx="67.5" cy="27" r="13"/>
    <!-- ears -->
    <path d="M 63 21 L 58 9 L 69 16 Z"/>
    <path d="M 70 16 L 80 8 L 76 21 Z"/>
  </g>

  <!-- ════ ORANGE FILL LAYER ════ -->
  <g fill="#e59b3f" stroke="#e59b3f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 35 30 Q 31 22 37 17" stroke-width="6" fill="none"/>
    <path d="M 39 27 Q 38 19 44 15" stroke-width="6" fill="none"/>
    <path d="M 66 32.5 A 26 26 0 1 1 34 32.5" stroke-width="16" fill="none"/>
    <path d="M 63 36 Q 60 38 62 41" stroke-width="5.5" fill="none"/>
    <circle cx="67.5" cy="27" r="9.5"/>
    <path d="M 63.5 21 L 60 11 L 68.5 16.5 Z"/>
    <path d="M 70.5 16.5 L 78 9.5 L 75 20 Z"/>
  </g>

  <!-- ════ LIGHT INNER HIGHLIGHT ════ -->
  <path d="M 66 32.5 A 26 26 0 1 1 34 32.5"
        fill="none" stroke="#f4c982" stroke-width="7" stroke-linecap="round"/>

  <!-- ════ FACE ════ -->
  <g fill="#2e3447">
    <circle cx="64" cy="27.5" r="1.7"/>
    <circle cx="70.5" cy="26" r="1.7"/>
    <circle cx="66.5" cy="31" r="1.1"/>
  </g>
  <path d="M 64.8 32 Q 66.3 33.6 67.8 31.8"
        fill="none" stroke="#2e3447" stroke-width="1.3" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#2e3447" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
    <line x1="61" y1="28"   x2="52" y2="26"/>
    <line x1="61" y1="30.5" x2="52" y2="31"/>
    <line x1="73.5" y1="24.5" x2="82" y2="22.5"/>
    <line x1="73.5" y1="27"   x2="82" y2="27.5"/>
  </g>

</svg>
