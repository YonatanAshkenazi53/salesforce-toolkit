<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Studio — Admin Toolkit for Salesforce</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <div id="app">

    <!-- Top bar -->
    <div class="ds-topbar">
      <div class="ds-brand">
        <button class="ds-back-btn" id="dsBackToToolkit" title="Back to Salesforce Toolkit">‹ Toolkit</button>
        <span class="ds-logo" data-i="cat" aria-hidden="true"></span>
        <span class="ds-brand-name">Data Studio</span>
      </div>
      <div class="ds-topbar-center">
        <button class="ds-trust-badge" id="dsSecurityBtn" aria-label="Security &amp; privacy — how the Studio uses your session">
          <span class="ds-trust-lock ds-i" data-i="lock" aria-hidden="true"></span>
          <span class="ds-trust-text">Local only — no data leaves your browser</span>
          <span class="ds-trust-arrow" aria-hidden="true">›</span>
        </button>
      </div>
      <div class="ds-topbar-right">
        <!-- Working org pair — populated by renderWorkingPair(); every view
             defaults its org selection to this pair. -->
        <div class="ds-pair-ctl" id="dsWorkingPair"></div>
        <button class="ds-cmd-topbar-hint" id="dsCmdPaletteBtn" title="Open command palette">
          <kbd>Ctrl</kbd><kbd>K</kbd>
          <span>Quick nav</span>
        </button>
        <!-- What's New lives in the topbar as a small announcement control
             (user 2026-07-26: "not as a feature :)"). Badge dot filled by
             studio-whatsnew.js while the newest version is unread. -->
        <button class="ds-whatsnew-top" id="dsWhatsNewTop" aria-label="What's New — what shipped, per version" title="What's New — what shipped, per version"><span class="ds-glyph ds-i" data-i="megaphone" aria-hidden="true"></span><span class="ds-pro-only">What's New</span><span id="dsWhatsNewBadge" aria-hidden="true"></span></button>
        <!-- E4 professional mode — swaps emoji chrome for plain text, tightens
             density. State lives in ds_settings.proMode (chrome.storage.local);
             applyProMode() in studio-core.js drives body.ds-pro + this button. -->
        <button class="ds-pro-toggle" id="dsProToggle" aria-pressed="false" title="Professional mode — replaces emoji with plain text and tightens density (presentation-friendly)">Pro</button>
        <!-- data-i drives the glyph through ::before because applyDarkMode
             rewrites this button's textContent; a child <span> would not
             survive that. Same trick as the debugger's relabelled buttons. -->
        <button class="ds-dark-toggle" id="dsDarkToggle" data-i="moon" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
        <!-- one theme button, as in the Toolkit: light → dark → OLED black → light (user 2026-10-18) -->
        <button id="dbgBtn" class="dbg-btn" title="Debug Log — off">Debug</button>
        <!-- Read the licence agreement and privacy notes again, any time — on
             both pages (user 2026-10-05: "license should show on both").
             Wired by sftk-terms.js, which looks for this id. -->
        <!-- 🧾 Activity (sftk-feed.js): everything the Toolkit and Data Studio did, and when — grouped by day and tool. -->
        <button id="sftkFeedBtn" class="dbg-btn" title="Activity — everything the Toolkit and Data Studio did, and when" aria-label="Activity — everything the Toolkit and Data Studio did, and when"><span class="ds-i" data-i="clock" aria-hidden="true"></span>Activity</button>
        <button id="sftkTermsBtn" class="dbg-btn" title="Licence agreement and privacy — read what you accepted" aria-label="Licence agreement and privacy"><span class="ds-i" data-i="scroll" aria-hidden="true"></span>Licence</button>
      </div>
    </div>

    <!-- Body: sidebar + main -->
    <div class="ds-body">

      <!-- E4 a11y: explicit landmark role + label; the active button also
           carries aria-current="page" (kept in sync by _applyView). -->
      <nav class="ds-nav" role="navigation" aria-label="Data Studio views">
        <div class="ds-nav-section-title">Overview</div>
        <button class="ds-nav-btn active" data-view="orgs" aria-current="page">
          <span class="ds-nav-icon ds-i" data-i="plug" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Connected Orgs</span>
            <span class="ds-nav-desc">Orgs open in your browser</span>
          </span>
        </button>
        <div class="ds-nav-section-title">Data</div>
        <button class="ds-nav-btn" data-view="profiles">
          <span class="ds-nav-icon ds-i" data-i="box" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Data Deployment</span>
            <span class="ds-nav-desc">Profiles + run transfer</span>
          </span>
        </button>
        <button class="ds-nav-btn" data-view="ring">
          <span class="ds-nav-icon ds-i" data-i="repeat" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">All open orgs</span>
            <span class="ds-nav-desc">Every deployment vs every open org</span>
          </span>
        </button>
        <button class="ds-nav-btn" data-view="seed">
          <span class="ds-nav-icon ds-i" data-i="upload" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Org Seeder</span>
            <span class="ds-nav-desc">Reset &amp; seed targets from the source</span>
          </span>
        </button>
        <button class="ds-nav-btn" data-view="picklists">
          <span class="ds-nav-icon ds-i" data-i="sliders" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Picklist Manager</span>
            <span class="ds-nav-desc">Values &amp; record types across orgs</span>
          </span>
        </button>

        <div class="ds-nav-section-title">Inspect</div>
        <button class="ds-nav-btn" data-view="compare">
          <span class="ds-nav-icon ds-i" data-i="search" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Org Compare</span>
            <span class="ds-nav-desc">Diff data across many objects</span>
          </span>
        </button>
        <!-- Graduated from Labs 2026-07-20: ring-aware (source of truth →
             every target), attributed results, no silent check failures. -->
        <button class="ds-nav-btn" data-view="readiness">
          <span class="ds-nav-icon ds-i" data-i="shield" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Deploy Readiness</span>
            <span class="ds-nav-desc">Schema readiness of every ring target</span>
          </span>
        </button>

        <!-- Campaign 3 phase 8: what the tools know about one org, together. -->
        <button class="ds-nav-btn" data-view="orghealth">
          <span class="ds-nav-icon ds-i" data-i="chart" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Org health</span>
            <span class="ds-nav-desc">What needs attention in one org</span>
          </span>
        </button>

        <!-- Labs: early previews, demoted from Inspect until strengthened
             (user 2026-07-18: "not very strong, some not even functional…
             ship them when we are ready" — plan Phase N5 is the exit bar). -->
        <div class="ds-nav-section-title">Labs · early previews</div>
        <button class="ds-nav-btn ds-nav-labs" data-view="schema">
          <span class="ds-nav-icon ds-i" data-i="flow" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Schema View</span>
            <span class="ds-nav-desc">Preview — flow &amp; object graph</span>
          </span>
        </button>
        <button class="ds-nav-btn ds-nav-labs" data-view="fields">
          <span class="ds-nav-icon ds-i" data-i="wand" aria-hidden="true"></span>
          <span class="ds-nav-label">
            <span class="ds-nav-name">Field Audit</span>
            <span class="ds-nav-desc">Preview — rank fields for cleanup</span>
          </span>
        </button>

        <!-- Nav footer -->
        <div class="ds-nav-footer">
          <span class="ds-nav-footer-text">Read-only by default</span>
          <span class="ds-nav-footer-dot">·</span>
          <span class="ds-nav-footer-text">Local only</span>
        </div>
      </nav>

      <main class="ds-main" id="dsMain">
        <div class="ds-init-loading">
          <div class="lp-robot-loading">
            <div class="lp-rcat">
              <div class="lp-rcat-ears"><div class="lp-rcat-ear"></div><div class="lp-rcat-ear"></div></div>
              <div class="lp-rcat-head"><div class="lp-rcat-eye"></div><div class="lp-rcat-eye"></div></div>
            </div>
            <div class="lp-robot-msg">Initializing Data Studio…</div>
          </div>
        </div>
      </main>
    </div>

  </div>

  <!-- Modal overlay -->
  <div id="dsModal" class="ds-modal-overlay" style="display:none">
    <div id="dsModalBox" class="ds-modal-box"></div>
  </div>

  <!-- Toast container -->
  <div id="dsToastContainer" class="ds-toast-container"></div>

  <!-- Trusted Types policy MUST load first — it monkey-patches innerHTML
       et al. so every subsequent script's HTML assignment is sanitized. -->
  <script src="trusted-types-policy.js"></script>
  <!-- The licence gate. Loads before every view so no page can start
       work before the user has accepted. -->
  <script src="sftk-terms.js"></script>
  <script src="sftk-build.js"></script>
  <script src="debug-logger.js"></script>
  <script src="onboarding.js"></script>
  <script src="debug-modal.js"></script>
  <!-- Data Studio — split by view (Phase 6b-2). Load order matters:
       core first (state + helpers + boot), then views in original order. -->
  <script src="sftk-org-identity.js"></script>
  <script src="sftk-confirm.js"></script>
  <script src="sftk-archive.js"></script>
  <script src="sftk-friendly-error.js"></script>
  <script src="sftk-run-progress.js"></script>
  <script src="sftk-api-budget.js"></script>
  <script src="sftk-matching.js"></script>
  <script src="sftk-pii.js"></script>
  <!-- Org Seeder deploys Custom Metadata records as a metadata package: the
       pure XML builders live in sftk-cmdt.js, the zip builder in sftk-zip.js.
       Both must load BEFORE studio-seed.js. -->
  <script src="sftk-zip.js"></script>
  <script src="sftk-write.js"></script>
  <script src="sftk-history.js"></script>
  <script src="sftk-feed.js"></script>
  <script src="sftk-cmdt.js"></script>
  <script src="sftk-identity.js"></script>
  <script src="sftk-undo.js"></script>
  <!-- Org health's "flows pinned below the release" card reuses the API-version helpers. -->
  <script src="sftk-apiver.js"></script>
  <script src="studio-core.js"></script>
  <script src="studio-profiles.js"></script>
  <script src="studio-sequences.js"></script>
  <script src="studio-builder.js"></script>
  <script src="studio-builder-modals.js"></script>
  <script src="studio-scan.js"></script>
  <script src="studio-transfer.js"></script>
  <script src="studio-reconcile.js"></script>
  <script src="studio-compare.js"></script>
  <script src="studio-history.js"></script>
  <script src="studio-undo.js"></script>
  <script src="studio-rollback.js"></script>
  <script src="studio-readiness.js"></script>
  <script src="studio-schema.js"></script>
  <script src="studio-fields.js"></script>
  <script src="studio-picklists.js"></script>
  <script src="studio-ring.js"></script>
  <script src="studio-seed.js"></script>
  <!-- T10 What's New — renders the committed CHANGELOG.md. Must load AFTER
       studio-core.js (it uses setMain/renderView wiring from there) and is
       shared verbatim with popup.html, so it carries its own HTML escaper. -->
  <script src="sftk-flowpause.js"></script>
  <script src="sftk-vrpause.js"></script>
  <script src="sftk-merge.js"></script>
  <script src="sftk-valueedit.js"></script>
  <script src="studio-valueedit.js"></script>
  <script src="studio-deploy.js"></script>
  <script src="studio-whatsnew.js"></script>
  <script src="studio-orghealth.js"></script>
  <!-- Phase X note: studio-tools.js (kept in the repo, not loaded) is the
       proven host for mounting popup tools in this shell — the user chose to
       keep the Debugger popup-only (2026-07-13). To mount a tool: add its
       script + studio-tools.js here, a nav button, and a renderView case. -->
</body>
</html>
