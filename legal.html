<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Licence &amp; privacy — Admin Toolkit for Salesforce</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #f3f3f3; color: #181818; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs a { padding: 6px 12px; border-radius: 6px; text-decoration: none; color: #0b5cab; border: 1px solid transparent; }
    .tabs a.on { background: #fff; border-color: #dddbda; font-weight: 600; }
    .doc { background: #fff; border-radius: 10px; padding: 22px 26px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .doc h1 { font-size: 20px; margin: 0 0 10px; }
    .doc h2 { font-size: 16px; margin: 22px 0 8px; }
    .doc h3 { font-size: 14px; margin: 16px 0 6px; }
    .doc p { margin: 8px 0; }
    .doc ul, .doc ol { margin: 6px 0 10px 22px; padding: 0; }
    .doc li { margin: 3px 0; }
    blockquote { margin: 10px 0; padding: 6px 12px; border-left: 3px solid #dddbda; opacity: .9; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    td, th { border: 1px solid #dddbda; padding: 4px 8px; text-align: left; vertical-align: top; }
    .err { color: #b00020; }
    /* Dark mode LAST: these rules share specificity with the light ones above, so source order decides.
       QA 2026-10-07 (user screenshot): with the block first, the light .doc / .tabs a.on / code rules won
       and the page showed near-white text on a white card. */
    @media (prefers-color-scheme: dark) { body { background: #16171a; color: #e6e6e6; } .doc { background: #1f2024; } .tabs a { color: #8ab4f8; } .tabs a.on { background: #2b2d33; } blockquote { border-color: #444; } code { background: #2b2d33; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="tabs" aria-label="Legal documents">
      <a href="legal.html?doc=eula" data-doc="eula">End User Licence Agreement</a>
      <a href="legal.html?doc=privacy" data-doc="privacy">Privacy</a>
      <a href="legal.html?doc=license" data-doc="license">Licence</a>
    </nav>
    <main class="doc" id="doc" aria-live="polite">Loading…</main>
  </div>
  <script src="legal.js"></script>
</body>
</html>
