<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce Toolkit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- ── Top bar (full width) ───────────────────────────────── -->
    <div class="app-topbar">
      <div class="app-brand">
        <span class="app-logo">🐾</span>
        <span class="app-brand-name">Salesforce Toolkit</span>
      </div>
      <div class="app-topbar-actions">
        <button id="homeBtn" class="dbg-btn" title="Back to home" style="display:none">🏠 Home</button>
        <!-- Persistent org chip — visible on every screen -->
        <button id="topbarOrgChip" class="topbar-org-chip" style="display:none" title="Switch active org">
          <span class="topbar-org-dot"></span>
          <span id="topbarOrgLabel" class="topbar-org-label">—</span>
          <span class="topbar-org-arrow">▾</span>
        </button>
        <button id="sftkDarkToggle" class="dbg-btn" title="Switch to dark mode">🌙</button>
        <button id="dataStudioBtn" class="dbg-btn" title="Open Data Studio — multi-org data deployment">🌐 Data Studio</button>
        <button id="popoutBtn" class="dbg-btn" title="Open this view in a full browser window (no 800px popup cap)">↗ Popout</button>
        <button id="dbgBtn" class="dbg-btn" title="Debug Log — off">🐛 Debug</button>
      </div>
    </div>

    <!-- ── Body: sidebar + main ──────────────────────────────── -->
    <div class="app-body">

      <!-- Left sidebar nav -->
      <nav class="app-sidebar">
        <div class="app-sidebar-section-title">Flows &amp; Automation</div>
        <button class="tab-btn app-nav-btn" data-tab="flows">
          <span class="app-nav-icon">🗑</span>
          <span>Flows</span>
        </button>
        <button class="tab-btn app-nav-btn" data-tab="dependencies">
          <span class="app-nav-icon">🗺</span>
          <span>Dependencies</span>
        </button>
        <button class="tab-btn app-nav-btn" data-tab="debugger">
          <span class="app-nav-icon">🐛</span>
          <span>Debugger</span>
        </button>

        <div class="app-sidebar-section-title">Pages &amp; Fields</div>
        <button class="tab-btn app-nav-btn" data-tab="pages">
          <span class="app-nav-icon">📄</span>
          <span>Lightning Pages</span>
        </button>
        <button class="tab-btn app-nav-btn" data-tab="fields">
          <span class="app-nav-icon">🔧</span>
          <span>Field Cleaner</span>
        </button>

        <div class="app-sidebar-section-title">Users &amp; Records</div>
        <button class="tab-btn app-nav-btn" data-tab="copy-perms">
          <span class="app-nav-icon">👥</span>
          <span>Copy Permissions</span>
        </button>
        <button class="tab-btn app-nav-btn" data-tab="licenses">
          <span class="app-nav-icon">🔑</span>
          <span>Licenses</span>
        </button>
        <button class="tab-btn app-nav-btn" data-tab="flow-access">
          <span class="app-nav-icon">🌊</span>
          <span>Flow Access</span>
        </button>
      </nav>

      <!-- ── Main content area ─────────────────────────────── -->
      <main class="app-main">

        <!-- Session Error Banner -->
        <div id="sessionError" class="error-banner session-error-banner" style="display:none">
          <div id="sessionErrorMsg"></div>
          <!-- Manual org URL connect — bypasses auto-detection -->
          <div style="margin-top:10px;display:flex;gap:6px;align-items:center">
            <input type="text" id="orgUrlInput" class="search-input"
              style="flex:1;font-size:12px;padding:5px 8px"
              placeholder="Paste org URL: https://myorg.my.salesforce.com">
            <button class="btn btn-primary btn-sm" id="connectOrgBtn">Connect</button>
          </div>
          <div style="margin-top:6px">
            <button class="btn btn-secondary btn-sm" id="retryBtn">🔄 Auto-detect</button>
            <button class="btn btn-secondary btn-sm" id="reloadExtBtn" style="margin-left:8px" title="Reload the extension and reconnect — use this if Retry doesn't work">⚙️ Reload Extension</button>
          </div>
        </div>

        <!-- Home page — shown on launch -->
        <div id="homeView" class="home-view">
          <div class="home-loading">
            <div class="lp-rcat">
              <div class="lp-rcat-ears"><div class="lp-rcat-ear"></div><div class="lp-rcat-ear"></div></div>
              <div class="lp-rcat-head"><div class="lp-rcat-eye"></div><div class="lp-rcat-eye"></div></div>
            </div>
            <div class="lp-robot-msg">Detecting Salesforce session…</div>
          </div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: FLOWS -->
        <!-- ================================================== -->
        <div id="tab-flows" class="tab-content" style="display:none">

          <!-- Toolbar -->
          <div class="toolbar" id="toolbar">
            <!-- Mode toggle first -->
            <div class="toolbar-row mode-row">
              <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn active" data-mode="delete">🗑 Delete</button>
                <button class="mode-btn" data-mode="backup">⬇ Backup</button>
                <button class="mode-btn" data-mode="restore">📥 Restore</button>
              </div>
            </div>
            <!-- Search below the mode tabs -->
            <div class="toolbar-row">
              <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search flows...">
              <button id="refreshBtn" class="btn-icon" title="Refresh flows">🔄</button>
            </div>
            <div class="toolbar-row toolbar-actions" id="flowToolbarActions">
              <button id="selectAllBtn" class="btn btn-secondary btn-sm">Select All</button>
              <button id="deselectAllBtn" class="btn btn-secondary btn-sm">Deselect All</button>
              <div id="scanSubflowBtnWrap" style="display:none">
                <button id="scanSubflowBtn" class="btn btn-secondary btn-sm">🔗 Scan Subflow Dependencies</button>
              </div>
            </div>
          </div>

          <!-- Loading state -->
          <div id="loadingState" class="loading-state">
            <div class="lp-rcat">
              <div class="lp-rcat-ears"><div class="lp-rcat-ear"></div><div class="lp-rcat-ear"></div></div>
              <div class="lp-rcat-head"><div class="lp-rcat-eye"></div><div class="lp-rcat-eye"></div></div>
            </div>
            <div class="lp-robot-msg">Loading flows…</div>
          </div>

          <!-- Scan / backup progress -->
          <div id="scanProgress" class="scan-progress" style="display:none">
            <div class="lp-rcat">
              <div class="lp-rcat-ears"><div class="lp-rcat-ear"></div><div class="lp-rcat-ear"></div></div>
              <div class="lp-rcat-head"><div class="lp-rcat-eye"></div><div class="lp-rcat-eye"></div></div>
            </div>
            <span id="scanProgressText">🔍 Scanning for subflow dependencies…</span>
          </div>

          <!-- Flow list (Delete & Backup modes) -->
          <div id="flowList" class="flow-list" style="display:none"></div>

          <!-- Empty state -->
          <div id="emptyState" class="empty-state" style="display:none">
            No flows found in this org.
          </div>

          <!-- Restore panel (Restore mode only) -->
          <div id="restorePanel" class="restore-panel" style="display:none">
            <div id="restoreDropZone" class="restore-drop-zone">
              <input type="file" id="restoreFileInput" accept=".json" style="display:none">
              <div class="restore-drop-icon">📁</div>
              <div class="restore-drop-text">
                Drop a <strong>.json</strong> backup file here<br>
                or <span class="restore-drop-link">click to browse</span>
              </div>
            </div>
            <div id="restorePreview" style="display:none"></div>
          </div>

          <!-- Selection summary -->
          <div id="selectionSummary" class="selection-summary">Nothing selected</div>

          <!-- Action button area -->
          <div id="deleteArea" class="delete-area">
            <button id="deleteBtn" class="btn btn-danger btn-delete" disabled>
              🗑 Delete Selected (0)
            </button>
            <button id="backupBtn" class="btn btn-primary btn-delete" disabled style="display:none">
              ⬇ Backup Selected (0)
            </button>
            <button id="restoreActionBtn" class="btn btn-primary btn-delete" disabled style="display:none">
              📥 Restore Selected (0) as Draft
            </button>
          </div>

          <!-- Progress panel (shown during deletion) -->
          <div id="progressPanel" class="progress-panel" style="display:none">
            <div id="robotContainer" class="robot-container">
              <div class="lp-rcat" id="robot">
                <div class="lp-rcat-ears"><div class="lp-rcat-ear"></div><div class="lp-rcat-ear"></div></div>
                <div class="lp-rcat-head"><div class="lp-rcat-eye"></div><div class="lp-rcat-eye"></div></div>
              </div>
            </div>
            <div id="progressStatus" class="progress-status">🗑 Deleting flows...</div>
            <div class="progress-bar-wrap">
              <div id="progressBar" class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width:0%"></div>
                <div id="progressText" class="progress-text">0 / 0 deleted</div>
              </div>
            </div>
            <div id="progressCurrentItem" class="progress-current-item"></div>
          </div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: DEPENDENCIES -->
        <!-- ================================================== -->
        <div id="tab-dependencies" class="tab-content" style="display:none">
          <div id="depNoDataBanner" class="info-banner" style="display:none"></div>
          <div id="depTreeContainer"></div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: AUTOMATION DEBUGGER -->
        <!-- ================================================== -->
        <div id="tab-debugger" class="tab-content" style="display:none">
          <div id="debuggerContainer"></div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: PAGES -->
        <!-- ================================================== -->
        <div id="tab-pages" class="tab-content" style="display:none">
          <div id="lpContainer"></div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: COPY PERMS -->
        <!-- ================================================== -->
        <div id="tab-copy-perms" class="tab-content" style="display:none">
          <div id="userCopyContainer"></div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: LICENSES -->
        <!-- ================================================== -->
        <div id="tab-licenses" class="tab-content" style="display:none">
          <div id="licenseManagerContainer"></div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: FLOW ACCESS -->
        <!-- ================================================== -->
        <div id="tab-flow-access" class="tab-content" style="display:none">
          <div id="flowPermsContainer"></div>
        </div>

        <!-- ================================================== -->
        <!-- TAB: FIELDS -->
        <!-- ================================================== -->
        <div id="tab-fields" class="tab-content" style="display:none">
          <div id="fieldCleanerContainer"></div>
        </div>


      </main>
    </div><!-- /.app-body -->

    <!-- ── Activity Bar ─────────────────────────────────────── -->
    <div id="activityBar" class="activity-bar">
      <div id="actProgressLine" class="act-progress-line" style="display:none"></div>
      <div class="act-body">
        <span id="actDot" class="act-dot act-dot-idle"></span>
        <span id="actMsg" class="act-msg">Ready</span>
        <span id="actCount" class="act-count" style="display:none"></span>
        <span id="actDur" class="act-dur" style="display:none"></span>
      </div>
    </div>

  </div><!-- /#app -->

  <!-- ── Modal overlay ─────────────────────────────────────────── -->
  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div id="modalBox" class="modal-box"></div>
  </div>

  <!-- Trusted Types policy MUST load first — it monkey-patches innerHTML
       et al. so every subsequent script's HTML assignment is sanitized. -->
  <script src="trusted-types-policy.js"></script>
  <script src="debug-logger.js"></script>
  <script src="sftk-zip.js"></script>
  <script src="sftk-org-identity.js"></script>
  <script src="sftk-friendly-error.js"></script>
  <script src="onboarding.js"></script>
  <script src="debug-modal.js"></script>
  <script src="dependency-map.js"></script>
  <script src="apex-debugger.js"></script>
  <script src="lightning-pages.js"></script>
  <script src="user-copy.js"></script>
  <script src="license-manager.js"></script>
  <script src="flow-permissions.js"></script>
  <script src="field-cleaner.js"></script>

  <script src="popup.js"></script>
</body>
</html>
